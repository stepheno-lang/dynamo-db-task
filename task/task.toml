artifacts = [
    "/app/output/path.json",
    "/app/output/summary.json",
    "/app/output/validation.json"
]

[task]
name = "dynamo/dependency-analyzer"
description = "Repair a property-graph dependency analyzer that ignores semantic dependency constraints."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Data Querying and Databases"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "Graph and semantic queries"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
# task_objective / artifact_type: pick from .dynamo/diversity-taxonomy.toml (lowercase snake_case).
task_objective = ["debug"]
artifact_type = ["codebase"]
expert_time_estimate_hours = 6

difficulty_explanation = "The task requires repairing graph traversal logic that must satisfy semantic dependency constraints rather than simply computing the shortest path. Correct solutions require reasoning about repository restrictions, trust levels, optional dependencies, and constrained graph traversal."

solution_explanation = "Repair the shortest-path implementation so edges are validated against repository, trust, and optional dependency rules before they are explored. The repaired traversal must return the globally minimum valid dependency chain."

verification_explanation = "The verifier independently computes the expected constrained dependency path and compares every output JSON file for correctness, including path selection, total cost, and constraint validation."

[verifier]
timeout_sec = 120.0                # increase based on your test suite's runtime demands
# Canonical TB2: the verifier runs in the environment image (no separate tests/Dockerfile).
# Harbor overlays tests/ at verify time; leave environment_mode unset for this shared model.

[agent]
timeout_sec = 120.0                # raise for hard tasks — agents may run for many minutes or hours

[environment]
build_timeout_sec = 600.0          # max seconds for the Docker build
cpus = 1                           # increase for parallel/compute-heavy workloads
memory_mb = 2048                   # increase for large datasets or in-memory processing
storage_mb = 10240                 # increase for tasks with large files or build artifacts
gpus = 0                           # max 1, expect H100
allow_internet = true              # open internet is available to the agent
mcp_servers = []                   # optional MCP servers to expose to the agent
